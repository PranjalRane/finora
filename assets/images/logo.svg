<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="finoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Finora Icon -->
  <g filter="url(#shadow)">
    <!-- Rounded Shield / Diamond Icon Container -->
    <rect x="6" y="8" width="48" height="48" rx="14" fill="url(#iconGlow)" />
    <!-- Rising financial chart / F emblem -->
    <path d="M20 38V30M27 38V24M34 38V18M41 38V26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Connecting trendline with dot -->
    <path d="M20 30L27 24L34 18L41 26" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="34" cy="18" r="2.5" fill="#34D399" />
  </g>

  <!-- FINORA Typography -->
  <text x="68" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#0F172A">FIN<tspan fill="#4F46E5">ORA</tspan></text>
  
  <!-- Subtitle -->
  <text x="69" y="50" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="#64748B">PERSONAL FINANCE</text>
</svg>
